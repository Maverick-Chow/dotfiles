# Rose Pine Dawn for superfile, based on the built-in rose-pine theme.
# Picked automatically by the spf wrapper in .zshrc (moon = dark mode, dawn = light mode).
# Theme reference: https://superfile.dev/configure/custom-theme/

code_syntax_highlight = "rose-pine-dawn"

#-- Full Screen
full_screen_fg = "#575279"
full_screen_bg = "#faf4ed"

#-- Gradient (two colours only)
gradient_color = ["#286983", "#b4637a"]

#-- File Panel
file_panel_fg = "#575279"
file_panel_bg = "#faf4ed"
file_panel_border = "#dfdad9"
file_panel_border_active = "#9893a5"
file_panel_top_directory_icon = "#56949f"
file_panel_top_path = "#d7827e"
file_panel_item_selected_fg = "#907aa9"
file_panel_item_selected_bg = "#faf4ed"

#-- Footer
footer_fg = "#575279"
footer_bg = "#faf4ed"
footer_border = "#dfdad9"
footer_border_active = "#ea9d34"

#-- Sidebar
sidebar_fg = "#575279"
sidebar_bg = "#faf4ed"
sidebar_title = "#9893a5"
sidebar_border = "#faf4ed"
sidebar_border_active = "#907aa9"
sidebar_item_selected_fg = "#ea9d34"
sidebar_item_selected_bg = "#faf4ed"
sidebar_divider = "#9893a5"

#-- Modals
modal_fg = "#575279"
modal_bg = "#faf4ed"
modal_border_active = "#9893a5"
modal_cancel_fg = "#575279"
modal_cancel_bg = "#cecacd"
modal_confirm_fg = "#faf4ed"
modal_confirm_bg = "#b4637a"

#-- Help Menu
help_menu_hotkey = "#ea9d34"
help_menu_title = "#56949f"

#-- Special
cursor = "#56949f"
correct = "#56949f"
error = "#b4637a"
hint = "#286983"
cancel = "#9893a5"
