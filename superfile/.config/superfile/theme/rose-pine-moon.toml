# Rose Pine Moon for superfile, based on the built-in rose-pine theme.
# Picked automatically by the spf wrapper in .zshrc (moon = dark mode, dawn = light mode).
# Theme reference: https://superfile.dev/configure/custom-theme/

code_syntax_highlight = "rose-pine-moon"

#-- Full Screen
full_screen_fg = "#e0def4"
full_screen_bg = "#232136"

#-- Gradient (two colours only)
gradient_color = ["#3e8fb0", "#eb6f92"]

#-- File Panel
file_panel_fg = "#e0def4"
file_panel_bg = "#232136"
file_panel_border = "#44415a"
file_panel_border_active = "#6e6a86"
file_panel_top_directory_icon = "#9ccfd8"
file_panel_top_path = "#ea9a97"
file_panel_item_selected_fg = "#c4a7e7"
file_panel_item_selected_bg = "#232136"

#-- Footer
footer_fg = "#e0def4"
footer_bg = "#232136"
footer_border = "#44415a"
footer_border_active = "#f6c177"

#-- Sidebar
sidebar_fg = "#e0def4"
sidebar_bg = "#232136"
sidebar_title = "#6e6a86"
sidebar_border = "#232136"
sidebar_border_active = "#c4a7e7"
sidebar_item_selected_fg = "#f6c177"
sidebar_item_selected_bg = "#232136"
sidebar_divider = "#6e6a86"

#-- Modals
modal_fg = "#e0def4"
modal_bg = "#232136"
modal_border_active = "#6e6a86"
modal_cancel_fg = "#e0def4"
modal_cancel_bg = "#56526e"
modal_confirm_fg = "#232136"
modal_confirm_bg = "#eb6f92"

#-- Help Menu
help_menu_hotkey = "#f6c177"
help_menu_title = "#9ccfd8"

#-- Special
cursor = "#9ccfd8"
correct = "#9ccfd8"
error = "#eb6f92"
hint = "#3e8fb0"
cancel = "#6e6a86"
