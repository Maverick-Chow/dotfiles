onboarding = false

# rose-pine: moon (dark) / dawn (light), following the terminal's appearance like tmux
[theme]
name = "rose-pine-dawn"
auto_switch = true
dark_name = "rose-pine"
light_name = "rose-pine-dawn"

# herdr has no moon variant, so lay moon's base/surface/overlay over rose-pine
[theme.custom.dark]
panel_bg = "#232136"
sidebar_bg = "#2a273f"
active_row_bg = "#393552"
selection_bg = "#44415a"

# keybindings ported from tmux.conf
[keys]
# custom prefix key
prefix = "ctrl+a"

# reload conf (resize mode moves off prefix+r to make room)
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# splits open in the current pane's directory (new_cwd = "follow" by default)
split_horizontal = "prefix+shift+minus"
split_vertical = "prefix+shift+backslash"

# vim navigation between panes (replaces vim-tmux-navigator's ctrl+hjkl,
# which would otherwise steal nvim's window keys)
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# panes resizing
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"
zoom = "prefix+m"

# sesh-style picker: prefix + f opens workspaces, agents and zoxide dirs in a floating popup
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "/Users/maverickchow/.config/herdr/workspace-picker.sh"
width = "80%"
height = "70%"

# same picker, opened on the agents list
[[keys.command]]
key = "prefix+a"
type = "popup"
command = "/Users/maverickchow/.config/herdr/workspace-picker.sh --start agents"
width = "80%"
height = "70%"

# sidebar fully hidden by default; prefix + b toggles it
[ui]
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"

# box around each pane (herdr's default), so every pane has a top edge to show its name on
pane_gaps = true
pane_outer_borders = true
pane_scrollbars = false

# right side of the tab bar: agent states | workspace | directory | user
# (zoom only shows while a pane is zoomed)
tab_bar_right_separator = " | "
tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "/Users/maverickchow/.config/herdr/agent-status.sh", interval_seconds = 2 },
  { type = "command", command = "/opt/homebrew/bin/herdr workspace get \"$HERDR_ACTIVE_WORKSPACE_ID\" | /opt/homebrew/bin/jq -r '\"\uf2d0 \\(.result.workspace.label)\"'", interval_seconds = 2 },
  { type = "command", command = "printf ' %s' \"$(basename \"$HERDR_ACTIVE_PANE_CWD\")\"", interval_seconds = 2 },
  { type = "text", text = "maverickchow ← " },
]
