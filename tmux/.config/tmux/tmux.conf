set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
# let apps send image data (kitty graphics) through to ghostty
set -g allow-passthrough on

# custom prefix key
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# reload conf
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# status line position
set -g status-position top

# vim navigation
setw -g mode-keys vi

# rose-pine theme: moon (dark) / dawn (light), switched by theme-sync.sh.
# -o keeps the current variant on reload instead of resetting it to moon
set -ogq @rose_pine_variant 'moon'
set -g @rose_pine_user 'on'
set -g @rose_pine_date_time '%H:%M | %a'
set -g @rose_pine_directory 'on'
set -g @rose_pine_window_separator ' → '
set -g @rose_pine_right_separator ' ← '
set -g @rose_pine_field_separator ' | '
# padding at both ends so the rounded window corners don't cut into the bar
set -g @rose_pine_status_left_prepend_section '  '
set -g @rose_pine_status_right_append_section '  '
# slight bar background (rose-pine surface for moon, overlay for dawn) instead of the terminal background;
# theme-sync.sh picks the matching one when the variant changes
set -g @bar_bg_moon '#2a273f'
set -g @bar_bg_dawn '#f2e9e1'
set -g @rose_pine_bar_bg_disable 'on'
set -gF @rose_pine_bar_bg_disabled_color_option '#{?#{==:#{@rose_pine_variant},dawn},#{@bar_bg_dawn},#{@bar_bg_moon}}'
# swap the window icon (next to the current window name) for a zoom icon while a pane is zoomed
set -g @rose_pine_current_window_icon '#{?window_zoomed_flag,󰁌,}'

# native dark/light mode hooks (tmux 3.6+)
# a switch fires a burst of both hooks in no fixed order, and client_theme can flip
# during it, so both hooks hand off to theme-sync.sh, which waits for it to settle
set-hook -g client-dark-theme "run -b ~/.config/tmux/theme-sync.sh"
set-hook -g client-light-theme "run -b ~/.config/tmux/theme-sync.sh"

# start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# open panes in current directory
unbind %
unbind '"'
bind _ split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# panes resizing
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

# sesh: prefix + T picks a session (tmux sessions, sesh configs, zoxide dirs) in a popup
set -g detach-on-destroy off # killing a session switches to another instead of detaching
# popups use the terminal colours (tmux 3.8 defaults to a grey 'theme' background)
set -g popup-style default
set -g popup-border-style 'fg=brightblack'
set -g popup-border-lines rounded
# fzf colours use ANSI numbers so they follow ghostty's rose pine palette in both modes
# (0 overlay, 1 love, 2 pine, 3 gold, 4 foam, 5 iris, 6 rose, 7 text, 8 muted)
bind f run-shell "sesh connect \"$(
  sesh list --icons | fzf --tmux center,80%,70% \
    --no-sort --ansi --layout reverse --border rounded \
    --border-label ' sesh ' --prompt 'all ❯ ' --pointer '▌' \
    --header '^j/^k move  ^a all  ^t tmux  ^g configs  ^x zoxide  ^d kill' \
    --color 'fg:7,bg:-1,hl:6,fg+:7:bold,bg+:0,hl+:6,gutter:-1' \
    --color 'border:8,label:6,header:8,info:4,prompt:5,pointer:5,marker:1,spinner:3,separator:8,scrollbar:8' \
    --bind 'tab:down,btab:up,ctrl-j:down,ctrl-k:up' \
    --bind 'ctrl-a:change-prompt(all ❯ )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(tmux ❯ )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(configs ❯ )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(zoxide ❯ )+reload(sesh list -z --icons)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(all ❯ )+reload(sesh list --icons)' \
    --preview-window 'right,55%,border-left' \
    --preview 'sesh preview {}'
)\""

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'rose-pine/tmux'
# keep resurrect/continuum after the theme: continuum autosaves via status-right
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# save sessions every 15 min and restore them when tmux starts
set -g @continuum-restore 'on'

# initialize TPM
run '~/.config/tmux/plugins/tpm/tpm'
